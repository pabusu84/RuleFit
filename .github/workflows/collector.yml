name: Dividend Data Collector

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 한국시간 오전 7시 실행
  push:
    paths:
      - 'targets.json'     # targets.json 변경 시 자동 실행
  workflow_dispatch:      # 수동 실행 버튼 제공

jobs:
  build:
    runs-on: ubuntu-latest # 오타 수정 (runs-runs-on -> runs-on)

    permissions:
      contents: write      # data.json 파일을 커밋/푸시할 수 있는 쓰기 권한 부여

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run Collector
        run: python collector.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update data.json" && git push)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance beautifulsoup4

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동 연동 배당 가계부</title>
    <!-- Chart.js 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --card-inner: #0b132b;
            --text-color: #ffffff;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
            --sub-text: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .container { max-width: 650px; margin: 0 auto; }
        
        .header-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .title-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        h1 { font-size: 1.4rem; margin: 0; font-weight: 700; }
        .subtitle { font-size: 0.8rem; color: var(--sub-text); margin-top: 4px; }

        .btn-group { display: flex; gap: 6px; }
        .btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-primary { background-color: #10b981; color: #000; font-weight: bold; }

        .stat-box {
            background-color: var(--card-inner);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .stat-label { font-size: 0.8rem; color: var(--sub-text); margin-bottom: 4px; }
        .stat-value-blue { font-size: 1.6rem; font-weight: 800; color: #ffffff; }
        .stat-value-green { font-size: 1.6rem; font-weight: 800; color: var(--accent-green); }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 14px; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; white-space: nowrap; }
        th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--border-color); }
        th:first-child, td:first-child { text-align: left; }
        th { color: var(--sub-text); font-weight: normal; }

        .account-badge { font-size: 0.7rem; color: var(--sub-text); }
        
        .chart-wrapper {
            position: relative;
            height: 220px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 상단 요약 카드 -->
        <div class="header-card">
            <div class="title-area">
                <div>
                    <h1>자동 연동 배당 가계부</h1>
                    <div class="subtitle">네이버 증권 & 야후 파이낸스 실시간 연동</div>
                </div>
                <div class="btn-group">
                    <button class="btn">🔑 토큰 설정</button>
                    <button class="btn btn-primary">+ 종목 추가</button>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-label">총 매수 금액</div>
                <div id="total-invest" class="stat-value-blue">0 원</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">연간 예상 실수령 배당금 (세후)</div>
                <div id="total-dividend" class="stat-value-green">0 원</div>
            </div>
        </div>

        <!-- 1. 월별 배당금 그래프 카드 -->
        <div class="card">
            <div class="card-title">📊 월별 예상 배당금 추이</div>
            <div class="chart-wrapper">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <!-- 2. 월별 배당 수령 합계 표 -->
        <div class="card">
            <div class="card-title">📅 월별 배당 수령 요약</div>
            <div class="table-container">
                <table id="monthly-summary-table">
                    <thead>
                        <tr>
                            <th>월</th>
                            <th>예상 배당금(세후)</th>
                            <th>비율</th>
                        </tr>
                    </thead>
                    <tbody id="monthly-summary-body">
                        <!-- JS 생성 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. 보유 종목 리스트 카드 -->
        <div class="card">
            <div class="card-title">📋 보유 종목 리스트</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>종목명</th>
                            <th>수량</th>
                            <th>내 평단가</th>
                            <th>현재가(자동)</th>
                            <th>연 배당금(세후)</th>
                        </tr>
                    </thead>
                    <tbody id="stock-list-body">
                        <tr><td colspan="5" style="text-align:center;">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const HOLDINGS = [
            { name: "삼성전자", code: "005930.KS", qty: 55, avg: 269454, account: "일반" },
            { name: "GPIX", code: "GPIX", qty: 287, avg: 54.96, account: "일반" },
            { name: "JEPQ", code: "JEPQ", qty: 373, avg: 57.09, account: "일반" },
            { name: "삼성전자우", code: "005935.KS", qty: 400, avg: 188396, account: "일반" },
            { name: "SK하이닉스", code: "000660.KS", qty: 30, avg: 2162833, account: "일반" },
            { name: "삼성SDI", code: "006400.KS", qty: 12, avg: 510791, account: "일반" },
            { name: "현대차2우B", code: "005387.KS", qty: 60, avg: 248000, account: "일반" },
            { name: "두산에너빌리티", code: "034020.KS", qty: 68, avg: 95108, account: "일반" },
            { name: "TIGER 배당커버드콜액티브", code: "472150.KS", qty: 215, avg: 95108, account: "일반" },
            { name: "TIGER 배당커버드콜액티브", code: "472150.KS", qty: 243, avg: 29545, account: "ISA" },
            { name: "AAPL", code: "AAPL", qty: 10, avg: 117.0, account: "일반" }
        ];

        let chartInstance = null;

        async function loadData() {
            try {
                const res = await fetch('data.json?v=' + new Date().getTime());
                const data = await res.json();
                
                const rate = data.exchangeRate || 1350;
                const stocks = data.stocks || {};

                renderDashboard(stocks, rate);
            } catch (err) {
                console.error("데이터 읽기 실패:", err);
            }
        }

        function renderDashboard(stocks, rate) {
            const tbody = document.getElementById('stock-list-body');
            tbody.innerHTML = '';

            let totalInvest = 0;
            let totalDiv = 0;
            const monthlyTotals = Array(12).fill(0);

            HOLDINGS.forEach(item => {
                const info = stocks[item.code] || stocks[item.code.replace('.KS', '')] || { price: 0, divPerShare: 0, months: [], currency: "KRW" };
                const isUSD = info.currency === 'USD' || ['GPIX', 'JEPQ', 'AAPL'].includes(item.code);

                // 현재가 및 배당금 환산
                const priceKRW = isUSD ? Math.round(info.price * rate) : info.price;
                const divKRWPerShare = isUSD ? (info.divPerShare * rate) : info.divPerShare;

                // 총 매수 금액
                const investKRW = isUSD ? (item.qty * item.avg * rate) : (item.qty * item.avg);
                totalInvest += investKRW;

                // 연간 세후 배당금
                const annualDivKRW = item.qty * divKRWPerShare * 0.846;
                totalDiv += annualDivKRW;

                // 월별 배당금 분배
                const months = (info.months && info.months.length > 0) ? info.months : [4];
                const divPerMonth = annualDivKRW / months.length;
                months.forEach(m => {
                    if (m >= 1 && m <= 12) monthlyTotals[m - 1] += divPerMonth;
                });

                // 표 행 추가
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><b>${item.name}</b> <span class="account-badge">(${item.account})</span></td>
                    <td>${item.qty}주</td>
                    <td>${isUSD ? '$' + item.avg : item.avg.toLocaleString()}</td>
                    <td style="color:#38bdf8;">${priceKRW.toLocaleString()}원</td>
                    <td style="color:#10b981;"><b>${Math.round(annualDivKRW).toLocaleString()}원</b></td>
                `;
                tbody.appendChild(row);
            });

            // 총합 업데이트
            document.getElementById('total-invest').innerText = `${Math.round(totalInvest).toLocaleString()} 원`;
            document.getElementById('total-dividend').innerText = `${Math.round(totalDiv).toLocaleString()} 원`;

            // 월별 표 및 그래프 렌더링
            renderMonthlySummary(monthlyTotals, totalDiv);
            renderChart(monthlyTotals);
        }

        function renderMonthlySummary(monthlyTotals, totalDiv) {
            const mBody = document.getElementById('monthly-summary-body');
            mBody.innerHTML = '';

            monthlyTotals.forEach((val, idx) => {
                const ratio = totalDiv > 0 ? ((val / totalDiv) * 100).toFixed(1) : 0;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="text-align:left;"><b>${idx + 1}월</b></td>
                    <td style="color:#10b981;"><b>${Math.round(val).toLocaleString()} 원</b></td>
                    <td style="color:#94a3b8;">${ratio}%</td>
                `;
                mBody.appendChild(row);
            });
        }

        function renderChart(monthlyData) {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
                    datasets: [{
                        label: '월별 배당금 (원)',
                        data: monthlyData.map(v => Math.round(v)),
                        backgroundColor: '#10b981',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
                    }
                }
            });
        }

        loadData();
    </script>
</body>
</html>

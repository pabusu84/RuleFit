<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RuleFit - 배당 가계부</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/bullish.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-primary: #f8fafc; --accent: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 16px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 8px; }
        button.btn-add { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; }
        .stock-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; }
        .btn-del { color: #ef4444; border: none; background: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <header style="text-align:center; margin-bottom:20px; color:var(--accent);"><h1>🚦 RuleFit</h1></header>
    <div class="card">
        <input type="text" id="tickerInput" placeholder="종목명 (예: 삼성전자, SCHD)" />
        <input type="number" id="qtyInput" placeholder="수량" />
        <button class="btn-add" onclick="addStock()">추가하기</button>
    </div>
    <div class="card"><ul id="stockList" style="list-style:none;"></ul></div>

    <script>
        const API_KEY = "FTsF20xcVN66SHzsmwfCn12KWCK0IllE";
        let usdKrwRate = 1415;
        let portfolio = JSON.parse(localStorage.getItem('rulefit_portfolio')) || [];

        // 국내 주식 사전 데이터
        const KR_DB = {
            "삼성전자": { price: 60000, div: 1444, currency: "KRW" },
            "SK하이닉스": { price: 190000, div: 1500, currency: "KRW" },
            "맥쿼리인프라": { price: 12000, div: 770, currency: "KRW" }
        };

        async function addStock() {
            const name = document.getElementById('tickerInput').value.trim();
            const qty = parseInt(document.getElementById('qtyInput').value);
            if (!name || isNaN(qty)) return;

            // 1. 국내 주식 매칭 (로직 강화)
            let found = false;
            for (let key in KR_DB) {
                if (name.includes(key) || key.includes(name)) {
                    saveAndRender(name, qty, KR_DB[key]);
                    found = true; break;
                }
            }
            if (found) return;

            // 2. 해외 주식 API
            try {
                const res = await fetch(`https://financialmodelingprep.com/api/v3/profile/${name.toUpperCase()}?apikey=${API_KEY}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    saveAndRender(name, qty, { price: data[0].price, div: data[0].lastDiv || (data[0].price * 0.05), currency: 'USD' });
                } else {
                    alert("종목을 찾을 수 없습니다. 직접 입력해주세요.");
                    const p = prompt("현재가 입력", "10000");
                    const d = prompt("연간 배당금 입력", "500");
                    saveAndRender(name, qty, { price: parseFloat(p), div: parseFloat(d), currency: 'KRW' });
                }
            } catch(e) { alert("오류 발생"); }
        }

        function saveAndRender(name, qty, info) {
            portfolio.push({ name, qty, info });
            localStorage.setItem('rulefit_portfolio', JSON.stringify(portfolio));
            render();
        }

        function render() {
            const list = document.getElementById('stockList');
            list.innerHTML = '';
            portfolio.forEach((item, idx) => {
                const totalKRW = (item.info.currency === 'KRW' ? item.info.div : item.info.div * usdKrwRate) * item.qty * 0.846;
                const li = document.createElement('li');
                li.className = 'stock-item';
                li.innerHTML = `<div><b>${item.name}</b> (${item.qty}주)</div><div>₩${Math.round(totalKRW).toLocaleString()}</div><button class="btn-del" onclick="portfolio.splice(${idx},1); localStorage.setItem('rulefit_portfolio', JSON.stringify(portfolio)); render();">&times;</button>`;
                list.appendChild(li);
            });
        }
        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동 연동 배당 가계부</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --card-inner: #0b132b;
            --text-color: #ffffff;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
            --sub-text: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .container { max-width: 600px; margin: 0 auto; }
        
        .header-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 20px;
        }

        .title-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.5rem; margin: 0; font-weight: 700; }
        .subtitle { font-size: 0.85rem; color: var(--sub-text); margin-top: 6px; }

        .btn-group { display: flex; gap: 8px; }
        .btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .btn-primary { background-color: #10b981; color: #000; font-weight: bold; }

        .stat-box {
            background-color: var(--card-inner);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .stat-label { font-size: 0.85rem; color: var(--sub-text); margin-bottom: 6px; }
        .stat-value-blue { font-size: 1.8rem; font-weight: 800; color: #ffffff; }
        .stat-value-green { font-size: 1.8rem; font-weight: 800; color: var(--accent-green); }

        .section-title { font-size: 1.2rem; font-weight: bold; margin: 24px 0 12px 0; }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
        th, td { padding: 12px 8px; text-align: right; border-bottom: 1px solid var(--border-color); }
        th:first-child, td:first-child { text-align: left; }
        th { color: var(--sub-text); font-weight: normal; }

        .account-badge {
            font-size: 0.75rem;
            color: var(--sub-text);
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 상단 요약 카드 -->
        <div class="header-card">
            <div class="title-area">
                <div>
                    <h1>자동 연동 배당 가계부</h1>
                    <div class="subtitle">종목 추가 시 targets.json 자동 업데이트 지원</div>
                </div>
                <div class="btn-group">
                    <button class="btn">🔑 토큰 설정</button>
                    <button class="btn btn-primary">+ 종목 추가</button>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-label">총 매수 금액</div>
                <div id="total-invest" class="stat-value-blue">0 원</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">연간 예상 실수령 배당금 (세후)</div>
                <div id="total-dividend" class="stat-value-green">0 원</div>
            </div>
        </div>

        <!-- 보유 종목 리스트 카드 -->
        <div class="card">
            <div class="section-title" style="margin-top:0;">보유 종목 리스트</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>종목명/티커</th>
                            <th>수량</th>
                            <th>내 평단가</th>
                            <th>현재가(자동)</th>
                            <th>연 배당금</th>
                        </tr>
                    </thead>
                    <tbody id="stock-list-body">
                        <tr><td colspan="5" style="text-align:center;">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 사용자 정의 보유 종목 수량 및 평단가 정보
        const MY_HOLDINGS = [
            { name: "삼성전자", code: "005930.KS", qty: 55, avgPrice: 269454, account: "일반" },
            { name: "GPIX", code: "GPIX", qty: 287, avgPrice: 54.96, account: "일반" },
            { name: "JEPQ", code: "JEPQ", qty: 373, avgPrice: 57.09, account: "일반" },
            { name: "삼성전자우", code: "005935.KS", qty: 400, avgPrice: 188396, account: "일반" },
            { name: "SK하이닉스", code: "000660.KS", qty: 30, avgPrice: 2162833, account: "일반" },
            { name: "삼성SDI", code: "006400.KS", qty: 12, avgPrice: 510791, account: "일반" },
            { name: "현대차2우B", code: "005387.KS", qty: 60, avgPrice: 248000, account: "일반" },
            { name: "두산에너빌리티", code: "034020.KS", qty: 68, avgPrice: 95108, account: "일반" },
            { name: "TIGER 배당커버드콜액티브", code: "472150.KS", qty: 215, avgPrice: 95108, account: "일반" },
            { name: "TIGER 배당커버드콜액티브", code: "472150.KS", qty: 243, avgPrice: 29545, account: "ISA" },
            { name: "TIME 미국나스닥100액티브", code: "472150.KS", qty: 30, avgPrice: 61054, account: "ISA" },
            { name: "AAPL", code: "AAPL", qty: 10, avgPrice: 117.0, account: "일반" }
        ];

        async function loadData() {
            try {
                const res = await fetch('data.json?v=' + new Date().getTime());
                const data = await res.json();
                
                const exchangeRate = data.exchangeRate || 1350;
                const stocksData = data.stocks || {};

                renderDashboard(stocksData, exchangeRate);
            } catch (err) {
                console.error("데이터 불러오기 실패:", err);
            }
        }

        function renderDashboard(stocksData, exchangeRate) {
            const tbody = document.getElementById('stock-list-body');
            tbody.innerHTML = '';

            let totalInvestKRW = 0;
            let totalDivKRW = 0;

            MY_HOLDINGS.forEach(stock => {
                const info = stocksData[stock.code] || stocksData[stock.code.replace('.KS', '')] || { price: 0, divPerShare: 0, currency: "KRW" };

                let currentPrice = info.price;
                let divPerShare = info.divPerShare;
                let isUSD = info.currency === 'USD' || stock.code === 'GPIX' || stock.code === 'JEPQ' || stock.code === 'AAPL';

                // 총 매수 금액 계산
                let investKRW = isUSD ? (stock.qty * stock.avgPrice * exchangeRate) : (stock.qty * stock.avgPrice);
                totalInvestKRW += investKRW;

                // 연간 배당금 계산 (세후 15.4% 적용)
                let annualDiv = isUSD ? (stock.qty * divPerShare * exchangeRate * 0.846) : (stock.qty * divPerShare * 0.846);
                totalDivKRW += annualDiv;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><b>${stock.name}</b> <span class="account-badge">(${stock.account})</span></td>
                    <td>${stock.qty}주</td>
                    <td>${stock.avgPrice.toLocaleString()}</td>
                    <td style="color:#38bdf8;">${isUSD ? currentPrice.toFixed(2) : currentPrice.toLocaleString()}</td>
                    <td style="color:#10b981;">${Math.round(annualDiv).toLocaleString()} 원</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('total-invest').innerText = `${Math.round(totalInvestKRW).toLocaleString()} 원`;
            document.getElementById('total-dividend').innerText = `${Math.round(totalDivKRW).toLocaleString()} 원`;
        }

        loadData();
    </script>
</body>
</html>

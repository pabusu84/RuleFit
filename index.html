<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동 연동 배당 가계부</title>
    <!-- Chart.js CDN 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --danger: #f43f5e;
            --accent: #38bdf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .header h1 { font-size: 1.3rem; margin: 0 0 4px 0; }
        .header p { font-size: 0.8rem; color: var(--text-sub); margin: 0; }

        .btn-add {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .summary-card {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .summary-title { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; }
        .summary-value { font-size: 1.6rem; font-weight: bold; }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 24px 0 12px 0;
            color: var(--text-main);
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .chart-grid { grid-template-columns: 1fr; }
        }

        .chart-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .chart-card h4 {
            margin: 0 0 12px 0;
            font-size: 0.9rem;
            color: var(--text-sub);
            text-align: center;
        }

        .table-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        th {
            background: #111827;
            color: var(--text-sub);
            padding: 12px 8px;
            font-weight: normal;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
        }

        .btn-action {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0 2px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 350px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
        }

        .modal-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }

        .modal-btns button {
            width: 48%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>자동 연동 배당 가계부</h1>
            <p>티커·수량·평단가만 입력하면 배당금 자동 계산</p>
        </div>
        <button class="btn-add" onclick="openModal('add')">+ 종목 추가</button>
    </div>

    <div class="summary-card">
        <div class="summary-title">총 매수 금액</div>
        <div class="summary-value" id="total-invest">0 원</div>
    </div>

    <div class="summary-card">
        <div class="summary-title">연간 예상 배당금</div>
        <div class="summary-value" style="color: var(--primary);" id="total-dividend">0 원</div>
    </div>

    <div class="summary-card">
        <div class="summary-title">평균 배당수익률</div>
        <div class="summary-value" style="color: #818cf8;" id="avg-yield">0.00 %</div>
    </div>

    <!-- 차트 구역 -->
    <div class="section-title">배당 분석 시각화</div>
    <div class="chart-grid">
        <div class="chart-card">
            <h4>월별 배당금 추이 (원)</h4>
            <canvas id="monthlyChart"></canvas>
        </div>
        <div class="chart-card">
            <h4>종목별 배당 비중</h4>
            <canvas id="portfolioChart"></canvas>
        </div>
    </div>

    <!-- 보유 종목 리스트 -->
    <div class="section-title">보유 종목 리스트</div>
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>종목명/티커</th>
                    <th>수량</th>
                    <th>내 평단가</th>
                    <th>현재가(자동)</th>
                    <th>연간 주당 배당금</th>
                    <th>지급월</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="portfolio-body"></tbody>
        </table>
    </div>

    <!-- 월별 배당금 표 -->
    <div class="section-title">월별 배당금 예측표 (원화 기준)</div>
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>종목명</th>
                    <th>1월</th><th>2월</th><th>3월</th><th>4월</th>
                    <th>5월</th><th>6월</th><th>7월</th><th>8월</th>
                    <th>9월</th><th>10월</th><th>11월</th><th>12월</th>
                    <th style="color: var(--primary);">연간 합계</th>
                </tr>
            </thead>
            <tbody id="monthly-body"></tbody>
            <tfoot>
                <tr id="monthly-footer" style="background: #111827; font-weight: bold; color: var(--primary);"></tr>
            </tfoot>
        </table>
    </div>
</div>

<!-- 모달 -->
<div class="modal" id="stockModal">
    <div class="modal-content">
        <h3 id="modal-title">종목 추가</h3>
        <input type="hidden" id="edit-index">
        <input type="text" id="input-name" placeholder="종목명/티커 (예: JEPI, 삼성전자)">
        <input type="number" id="input-qty" placeholder="수량 (예: 10)">
        <input type="number" id="input-price" placeholder="평단가 (원/달러)" step="any">
        <div class="modal-btns">
            <button onclick="closeModal()" style="background: #475569; color: white;">취소</button>
            <button onclick="saveStock()" style="background: var(--primary); color: black;">저장</button>
        </div>
    </div>
</div>

<script>
    let marketData = { stocks: {}, exchangeRate: 1350 };
    let barChartInstance = null;
    let pieChartInstance = null;
    
    let myPortfolio = JSON.parse(localStorage.getItem('myPortfolio')) || [
        { name: "JEPI", qty: 373, price: 57.09 },
        { name: "GPIX", qty: 287, price: 54.96 },
        { name: "삼성전자", qty: 55, price: 269454 }
    ];

    async function init() {
        try {
            const res = await fetch('./data.json?t=' + new Date().getTime());
            if (res.ok) marketData = await res.json();
        } catch (e) {
            console.error("data.json 로드 오류", e);
        }
        render();
    }

    function cleanStr(str) {
        return (str || '').toString().replace(/\s+/g, '').toUpperCase();
    }

    function findLiveData(name) {
        if (!marketData.stocks) return {};
        const target = cleanStr(name);
        for (let key in marketData.stocks) {
            if (cleanStr(key) === target) return marketData.stocks[key];
        }
        for (let key in marketData.stocks) {
            const item = marketData.stocks[key];
            if (item.ticker && cleanStr(item.ticker) === target) return item;
        }
        return {};
    }

    function render() {
        const tbody = document.getElementById('portfolio-body');
        tbody.innerHTML = '';

        let totalInvestKRW = 0;
        let totalDividendKRW = 0;
        const rate = marketData.exchangeRate || 1350;

        const monthTotals = new Array(12).fill(0);
        const monthlyRows = [];
        const stockDivSums = []; // 종목별 연간 배당금 합계

        myPortfolio.forEach((item, index) => {
            const liveData = findLiveData(item.name);
            const curPrice = liveData.price || 0;
            const divPerShare = liveData.divPerShare || 0;
            const months = liveData.months || [];
            const monthsText = months.length > 0 ? months.join(',') + '월' : '-';
            
            const isUSD = liveData.currency === "USD" || (!liveData.currency && item.price < 1000);

            const investAmount = item.qty * item.price;
            const dividendAmount = item.qty * divPerShare;

            const investKRW = isUSD ? investAmount * rate : investAmount;
            const dividendKRW = isUSD ? dividendAmount * rate : dividendAmount;

            totalInvestKRW += investKRW;
            totalDividendKRW += dividendKRW;
            stockDivSums.push({ name: item.name, value: Math.round(dividendKRW) });

            // 1. 보유 종목 리스트 랜더링
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td>${item.qty}주</td>
                <td>${item.price.toLocaleString()}</td>
                <td style="color: var(--accent);">${curPrice ? curPrice.toLocaleString() : '0'}</td>
                <td style="color: var(--primary);">${divPerShare ? divPerShare.toLocaleString() : '0'}</td>
                <td>${monthsText}</td>
                <td>
                    <button class="btn-action" onclick="openModal('edit', ${index})">✏️</button>
                    <button class="btn-action" onclick="deleteStock(${index})" style="color:var(--danger)">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);

            // 2. 월별 계산
            const divPerOccurence = months.length > 0 ? dividendKRW / months.length : 0;
            const rowDivs = new Array(12).fill(0);

            months.forEach(m => {
                if (m >= 1 && m <= 12) {
                    rowDivs[m - 1] = divPerOccurence;
                    monthTotals[m - 1] += divPerOccurence;
                }
            });

            monthlyRows.push({ name: item.name, divs: rowDivs, total: dividendKRW });
        });

        // 상단 요약 카드
        document.getElementById('total-invest').innerText = Math.round(totalInvestKRW).toLocaleString() + ' 원';
        document.getElementById('total-dividend').innerText = Math.round(totalDividendKRW).toLocaleString() + ' 원';
        const avgYield = totalInvestKRW > 0 ? ((totalDividendKRW / totalInvestKRW) * 100).toFixed(2) : "0.00";
        document.getElementById('avg-yield').innerText = avgYield + ' %';

        // 표 및 차트 그리기
        renderMonthlyTable(monthlyRows, monthTotals, totalDividendKRW);
        renderCharts(monthTotals, stockDivSums);

        localStorage.setItem('myPortfolio', JSON.stringify(myPortfolio));
    }

    function renderMonthlyTable(rows, totals, grandTotal) {
        const mBody = document.getElementById('monthly-body');
        const mFooter = document.getElementById('monthly-footer');
        mBody.innerHTML = '';

        rows.forEach(row => {
            const tr = document.createElement('tr');
            let cells = `<td><strong>${row.name}</strong></td>`;
            row.divs.forEach(val => {
                cells += `<td>${val > 0 ? Math.round(val).toLocaleString() : '-'}</td>`;
            });
            // 종목별 연간 합계 추가
            cells += `<td style="font-weight:bold; color:var(--primary);">${Math.round(row.total).toLocaleString()} 원</td>`;
            tr.innerHTML = cells;
            mBody.appendChild(tr);
        });

        // 푸터 전체 합계
        let footerCells = `<td>합계</td>`;
        totals.forEach(sum => {
            footerCells += `<td>${sum > 0 ? Math.round(sum).toLocaleString() : '0'}</td>`;
        });
        footerCells += `<td style="color:#10b981;">${Math.round(grandTotal).toLocaleString()} 원</td>`;
        mFooter.innerHTML = footerCells;
    }

    function renderCharts(monthlyTotals, stockDivSums) {
        // 1. 월별 막대 차트
        const ctxBar = document.getElementById('monthlyChart').getContext('2d');
        if (barChartInstance) barChartInstance.destroy();
        barChartInstance = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'],
                datasets: [{
                    label: '월별 배당금 (원)',
                    data: monthlyTotals.map(v => Math.round(v)),
                    backgroundColor: '#10b981',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                    y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                }
            }
        });

        // 2. 종목별 도넛/파이 차트
        const ctxPie = document.getElementById('portfolioChart').getContext('2d');
        if (pieChartInstance) pieChartInstance.destroy();
        pieChartInstance = new Chart(ctxPie, {
            type: 'doughnut',
            data: {
                labels: stockDivSums.map(s => s.name),
                datasets: [{
                    data: stockDivSums.map(s => s.value),
                    backgroundColor: ['#10b981', '#38bdf8', '#818cf8', '#f43f5e', '#fbbf24', '#a855f7']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#f8fafc', boxWidth: 12 } }
                }
            }
        });
    }

    function openModal(mode, index = null) {
        const modal = document.getElementById('stockModal');
        const title = document.getElementById('modal-title');
        
        if (mode === 'edit') {
            title.innerText = '종목 수정';
            const item = myPortfolio[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('input-name').value = item.name;
            document.getElementById('input-qty').value = item.qty;
            document.getElementById('input-price').value = item.price;
        } else {
            title.innerText = '종목 추가';
            document.getElementById('edit-index').value = '';
            document.getElementById('input-name').value = '';
            document.getElementById('input-qty').value = '';
            document.getElementById('input-price').value = '';
        }
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('stockModal').style.display = 'none';
    }

    function saveStock() {
        const indexStr = document.getElementById('edit-index').value;
        const name = document.getElementById('input-name').value.trim();
        const qty = parseFloat(document.getElementById('input-qty').value);
        const price = parseFloat(document.getElementById('input-price').value);

        if (!name || isNaN(qty) || isNaN(price)) {
            alert('올바른 데이터를 입력해주세요.');
            return;
        }

        if (indexStr !== '') {
            myPortfolio[parseInt(indexStr)] = { name, qty, price };
        } else {
            myPortfolio.push({ name, qty, price });
        }

        closeModal();
        render();
    }

    function deleteStock(index) {
        if (confirm('해당 종목을 삭제하시겠습니까?')) {
            myPortfolio.splice(index, 1);
            render();
        }
    }

    window.onload = init;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동 연동 배당 가계부</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --danger: #f43f5e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.3rem;
            margin: 0 0 4px 0;
        }

        .header p {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin: 0;
        }

        .btn-add {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .summary-card {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .summary-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .table-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
        }

        th {
            background: #111827;
            color: var(--text-sub);
            padding: 12px 6px;
            font-weight: normal;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 6px;
            border-bottom: 1px solid var(--border);
        }

        .btn-del {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1rem;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 350px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
        }

        .modal-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }

        .modal-btns button {
            width: 48%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>자동 연동 배당 가계부</h1>
            <p>티커·수량·평단가만 입력하면 배당금 자동 계산</p>
        </div>
        <button class="btn-add" onclick="openModal()">+ 종목 추가</button>
    </div>

    <div class="summary-card">
        <div class="summary-title">총 매수 금액</div>
        <div class="summary-value" id="total-invest">0 원</div>
    </div>

    <div class="summary-card">
        <div class="summary-title">연간 예상 배당금</div>
        <div class="summary-value" style="color: var(--primary);" id="total-dividend">0 원</div>
    </div>

    <div class="summary-card">
        <div class="summary-title">평균 배당수익률</div>
        <div class="summary-value" style="color: #818cf8;" id="avg-yield">0.00 %</div>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>종목명/티커</th>
                    <th>수량</th>
                    <th>내 평단가</th>
                    <th>현재가<br>(자동)</th>
                    <th>연간 주당<br>배당금 (자동)</th>
                    <th>지급월<br>(자동)</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="portfolio-body">
                <!-- 종목 노출 영역 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 종목 추가 모달 -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <h3>종목 추가</h3>
        <input type="text" id="input-name" placeholder="종목명/티커 (예: Jepq, 삼성전자)">
        <input type="number" id="input-qty" placeholder="수량 (예: 10)">
        <input type="number" id="input-price" placeholder="평단가 (원/달러)">
        <div class="modal-btns">
            <button onclick="closeModal()" style="background: #475569; color: white;">취소</button>
            <button onclick="addStock()" style="background: var(--primary); color: black;">추가</button>
        </div>
    </div>
</div>

<script>
    let marketData = { stocks: {}, exchangeRate: 1350 };
    
    // 로컬스토리지 저장 포트폴리오
    let myPortfolio = JSON.parse(localStorage.getItem('myPortfolio')) || [
        { name: "Jepq", qty: 373, price: 57.08 },
        { name: "삼성전자", qty: 55, price: 269454 }
    ];

    async function init() {
        try {
            // 캐시 방지 적용하여 data.json 로드
            const res = await fetch('./data.json?t=' + new Date().getTime());
            if (res.ok) {
                marketData = await res.json();
            }
        } catch (e) {
            console.error("data.json 로드 오류", e);
        }
        render();
    }

    function render() {
        const tbody = document.getElementById('portfolio-body');
        tbody.innerHTML = '';

        let totalInvestKRW = 0;
        let totalDividendKRW = 0;
        const rate = marketData.exchangeRate || 1350;

        myPortfolio.forEach((item, index) => {
            // marketData 조회 (소문자/대문자/한글 키 대응)
            const stockKey = item.name.trim();
            const liveData = marketData.stocks[stockKey] || 
                             marketData.stocks[stockKey.toLowerCase()] || 
                             marketData.stocks[stockKey.toUpperCase()] || {};

            const curPrice = liveData.price || 0;
            const divPerShare = liveData.divPerShare || 0;
            const months = (liveData.months && liveData.months.length > 0) ? liveData.months.join(',') + '월' : '-';
            const isUSD = liveData.currency === "USD" || (!liveData.currency && item.price < 1000);

            // 투자금 및 배당금 계산
            const investAmount = item.qty * item.price;
            const dividendAmount = item.qty * divPerShare;

            if (isUSD) {
                totalInvestKRW += investAmount * rate;
                totalDividendKRW += dividendAmount * rate;
            } else {
                totalInvestKRW += investAmount;
                totalDividendKRW += dividendAmount;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td>${item.qty}주</td>
                <td>${item.price.toLocaleString()}</td>
                <td style="color: #38bdf8;">${curPrice ? curPrice.toLocaleString() : '0'}</td>
                <td style="color: var(--primary);">${divPerShare ? divPerShare.toLocaleString() : '0'}</td>
                <td>${months}</td>
                <td><button class="btn-del" onclick="deleteStock(${index})">🗑️</button></td>
            `;
            tbody.appendChild(tr);
        });

        // 요약 정보 업데이트
        document.getElementById('total-invest').innerText = Math.round(totalInvestKRW).toLocaleString() + ' 원';
        document.getElementById('total-dividend').innerText = Math.round(totalDividendKRW).toLocaleString() + ' 원';
        
        const avgYield = totalInvestKRW > 0 ? ((totalDividendKRW / totalInvestKRW) * 100).toFixed(2) : "0.00";
        document.getElementById('avg-yield').innerText = avgYield + ' %';

        localStorage.setItem('myPortfolio', JSON.stringify(myPortfolio));
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function addStock() {
        const name = document.getElementById('input-name').value;
        const qty = parseFloat(document.getElementById('input-qty').value);
        const price = parseFloat(document.getElementById('input-price').value);

        if (name && qty && price) {
            myPortfolio.push({ name, qty, price });
            closeModal();
            render();
            document.getElementById('input-name').value = '';
            document.getElementById('input-qty').value = '';
            document.getElementById('input-price').value = '';
        }
    }

    function deleteStock(index) {
        myPortfolio.splice(index, 1);
        render();
    }

    window.onload = init;
</script>
</body>
</html>

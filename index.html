깃허브 웹사이트에서 직접 수정하실 때의 진행 절차입니다.

1. `index.html` 파일 화면 우측 상단의 **연필 아이콘(Edit this file)**을 누릅니다.
2. 기존에 들어있던 코드를 전체 선택(`Ctrl + A` 또는 `Cmd + A`)해서 삭제합니다.
3. 준비하신 새로운 전체 코드를 붙여넣습니다(`Ctrl + V` 또는 `Cmd + V`).
4. 우측 상단의 초록색 **Commit changes...** 버튼을 누른 뒤, 한 번 더 **Commit changes**를 클릭해 저장합니다.

만약 파일 전체가 아니라 **특정 부분만 수정**하는 코드라면, 기존 파일에서 해당 위치를 찾아 그 부분만 교체해 주셔야 파일이 깨지지 않습니다. 어떤 코드를 수정하시려는지 말씀해주시면 정확한 위치를 안내해 드릴 수 있습니다.

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동 연동 배당 가계부</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #10b981;
            --sub-text: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .container { max-width: 600px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        h1 { font-size: 1.4rem; margin-top: 0; margin-bottom: 8px; }
        .subtitle { font-size: 0.85rem; color: var(--sub-text); margin-bottom: 16px; }
        .stat-label { font-size: 0.85rem; color: var(--sub-text); margin-bottom: 4px; }
        .stat-value { font-size: 1.6rem; font-weight: bold; color: var(--accent-color); }
        .stat-value-sub { font-size: 1.4rem; font-weight: bold; color: #38bdf8; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { padding: 10px 6px; text-align: right; border-bottom: 1px solid var(--border-color); }
        th:first-child, td:first-child { text-align: left; }
        th { color: var(--sub-text); font-weight: normal; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>자동 연동 배당 가계부</h1>
            <div class="subtitle">네이버 증권 & 야후 파이낸스 실시간 연동</div>
            <div>
                <div class="stat-label">연간 예상 실수령 배당금 (세후)</div>
                <div id="total-dividend" class="stat-value">0 원</div>
            </div>
        </div>

        <div class="card">
            <h2 style="font-size: 1.1rem; margin-top:0;">보유 종목 리스트</h2>
            <table>
                <thead>
                    <tr>
                        <th>종목명</th>
                        <th>현재가(원)</th>
                        <th>주당 배당금(원)</th>
                    </tr>
                </thead>
                <tbody id="stock-list-body">
                    <tr><td colspan="3" style="text-align:center;">데이터를 불러오는 중입니다...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const NAME_MAP = {
            "005930.KS": "삼성전자", "005930": "삼성전자",
            "005935.KS": "삼성전자우", "005935": "삼성전자우",
            "000660.KS": "SK하이닉스", "000660": "SK하이닉스",
            "006400.KS": "삼성SDI", "006400": "삼성SDI",
            "005387.KS": "현대차2우B", "005387": "현대차2우B",
            "034020.KS": "두산에너빌리티", "034020": "두산에너빌리티",
            "472150.KS": "TIGER 배당커버드콜액티브", "472150": "TIGER 배당커버드콜액티브"
        };

        async function loadData() {
            try {
                const res = await fetch('data.json?v=' + new Date().getTime());
                const data = await res.json();
                
                const exchangeRate = data.exchangeRate || 1350;
                const stocksData = data.stocks || {};

                renderTable(stocksData, exchangeRate);
            } catch (err) {
                console.error("데이터 로딩 실패:", err);
            }
        }

        function renderTable(stocksData, exchangeRate) {
            const tbody = document.getElementById('stock-list-body');
            tbody.innerHTML = '';

            let totalDivKRW = 0;
            const processedKeys = new Set();

            Object.keys(stocksData).forEach(key => {
                const cleanKey = key.replace('.KS', '');
                if (processedKeys.has(cleanKey)) return;
                processedKeys.add(cleanKey);

                const item = stocksData[key];
                let priceKRW = item.price;
                let divKRW = item.divPerShare;

                if (item.currency === 'USD') {
                    priceKRW = Math.round(item.price * exchangeRate);
                    divKRW = Math.round(item.divPerShare * exchangeRate);
                }

                totalDivKRW += divKRW;
                const displayName = NAME_MAP[key] || key;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><b>${displayName}</b></td>
                    <td>${priceKRW.toLocaleString()} 원</td>
                    <td style="color:#10b981;">${divKRW.toLocaleString()} 원</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('total-dividend').innerText = `${Math.round(totalDivKRW).toLocaleString()} 원`;
        }

        loadData();
    </script>
</body>
</html>

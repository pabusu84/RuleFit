<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuleFit - 배당 관리 앱</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #2563eb;
            --text-color: #ffffff;
            --text-sub: #a0a0a0;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .info-bar {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .stock-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stock-ticker {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .stock-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .info-label {
            color: var(--text-sub);
        }

        .info-value {
            text-align: right;
            font-weight: 600;
        }

        .badge-month {
            display: inline-block;
            background-color: #2a2a2a;
            color: #60a5fa;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-right: 4px;
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RuleFit 배당 트래커</h1>
    </div>

    <div class="info-bar">
        <span>기준 환율: <strong id="exchange-rate">1,350</strong> 원/USD</span>
        <span id="last-updated">불러오는 중...</span>
    </div>

    <div id="loading">데이터를 불러오는 중입니다...</div>
    <div id="stock-list"></div>
</div>

<script>
    async function loadData() {
        const loadingEl = document.getElementById('loading');
        const listEl = document.getElementById('stock-list');
        const exRateEl = document.getElementById('exchange-rate');
        const updatedEl = document.getElementById('last-updated');

        try {
            // 캐시 방지 파라미터(?t=timestamp) 적용
            const response = await fetch('./data.json?t=' + new Date().getTime());
            
            if (!response.ok) {
                throw new Error("data.json 파일을 불러올 수 없습니다.");
            }

            const data = await response.json();
            
            // 환율 표시
            if (data.exchangeRate) {
                exRateEl.innerText = Number(data.exchangeRate).toLocaleString();
            }

            // 업데이트 시간 표시
            const now = new Date();
            updatedEl.innerText = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} 갱신됨`;

            // 종목 리스트 랜더링
            loadingEl.style.display = 'none';
            listEl.innerHTML = '';

            const stocks = data.stocks;
            
            // 중복 키 제거하여 기본 리스트 생성
            const uniqueTickers = Array.from(new Set(Object.values(stocks).map(s => s.ticker)));

            uniqueTickers.forEach(ticker => {
                const item = Object.values(stocks).find(s => s.ticker === ticker);
                if (!item) return;

                const name = Object.keys(stocks).find(key => stocks[key].ticker === ticker && key === key.toUpperCase()) || ticker;
                const isKRW = item.currency === "KRW";
                const priceFormatted = isKRW 
                    ? `₩${Number(item.price).toLocaleString()}` 
                    : `$${Number(item.price).toFixed(2)}`;

                const divFormatted = isKRW 
                    ? `₩${Number(item.divPerShare).toLocaleString()}` 
                    : `$${Number(item.divPerShare).toFixed(2)}`;

                // 배당 수익률 계산
                const yieldPct = item.price > 0 ? ((item.divPerShare / item.price) * 100).toFixed(2) : "0.00";

                // 배당월 태그
                const monthsHtml = item.months && item.months.length > 0
                    ? item.months.map(m => `<span class="badge-month">${m}월</span>`).join('')
                    : '<span style="color:#666;">정보 없음</span>';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="stock-name">${name}</span>
                            <span class="stock-ticker">(${item.ticker})</span>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 1.1rem; font-weight: bold;">${priceFormatted}</div>
                        </div>
                    </div>
                    <div class="stock-info">
                        <div>
                            <span class="info-label">연간 주당 배당금</span>
                        </div>
                        <div class="info-value">${divFormatted}</div>

                        <div>
                            <span class="info-label">예상 배당수익률</span>
                        </div>
                        <div class="info-value" style="color: #34d399;">${yieldPct}%</div>

                        <div>
                            <span class="info-label">배당 지급월</span>
                        </div>
                        <div class="info-value">${monthsHtml}</div>
                    </div>
                `;
                listEl.appendChild(card);
            });

        } catch (error) {
            console.error(error);
            loadingEl.innerText = "데이터 연동 실패: data.json 파일이 없거나 브라우저 오류입니다.";
            loadingEl.style.color = "#ef4444";
        }
    }

    // 앱 실행시 데이터 로드
    window.onload = loadData;
</script>

</body>
</html>
